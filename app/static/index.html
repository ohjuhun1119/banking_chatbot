<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>은행 문의 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --room: #FFFFFF;
    --frame: #EEF1F5;
    --bar: #FFFFFF;
    --ink: #1A2230;
    --ink-soft: #6B7585;
    --me: #2F6BEA;
    --me-ink: #FFFFFF;
    --bot: #F1F3F7;
    --bot-ink: #1A2230;
    --chip: #FFFFFF;
    --chip-line: #D7DDE6;
    --notice: #F1F3F7;
    --stamp-ok: #2F6BEA;
    --stamp-block: #C62F45;
    --stamp-unclear: #9A6400;
    --shadow: none;
    color-scheme: light;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --room: #12161C;
      --frame: #0B0E12;
      --bar: #171C23;
      --ink: #E6EAF0;
      --ink-soft: #97A1B0;
      --me: #3D7BF4;
      --bot: #232A33;
      --bot-ink: #E6EAF0;
      --chip: #1B2129;
      --chip-line: #323B47;
      --notice: #1E242C;
      --stamp-ok: #7FA8FF;
      --stamp-block: #F27C8E;
      --stamp-unclear: #E2B35C;
      --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 400 15px/1.55 var(--sans);
    color: var(--ink);
    background: var(--frame);
    display: flex; justify-content: center;
  }

  /* 채팅방 한 개: 휴대폰 폭으로 가운데, 휴대폰에서는 화면 전체 */
  .room {
    width: 100%; max-width: 460px; height: 100%;
    display: grid; grid-template-rows: auto 1fr auto;
    background: var(--room);
    box-shadow: 0 0 0 1px var(--chip-line);
  }

  /* 상단 바 */
  .top {
    display: flex; align-items: center; gap: 0.7rem;
    padding: calc(0.7rem + env(safe-area-inset-top, 0px)) 1rem 0.7rem;
    background: var(--bar); border-bottom: 1px solid var(--chip-line);
  }
  .avatar {
    flex: none; width: 38px; height: 38px; border-radius: 14px;
    background: var(--me); color: #fff; display: grid; place-items: center;
  }
  .avatar svg { width: 22px; height: 22px; }
  .who { flex: 1; min-width: 0; }
  .who strong { display: block; font-size: 1rem; font-weight: 600; }
  .who span { font-size: 0.78rem; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 0.35rem; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); }
  .dot.on { background: #2BA36B; }
  .dot.off { background: var(--stamp-block); }
  .switch {
    flex: none; display: flex; border: 1px solid var(--chip-line); border-radius: 999px; overflow: hidden;
    font-size: 0.78rem;
  }
  .switch label { padding: 0.3rem 0.7rem; cursor: pointer; color: var(--ink-soft); }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch label:has(input:checked) { background: var(--me); color: #fff; font-weight: 600; }
  .switch label:has(input:focus-visible) { outline: 2px solid var(--me); outline-offset: -3px; }

  /* 대화 */
  .chat { overflow-y: auto; padding: 0.9rem 0.85rem 1.2rem; scroll-behavior: smooth; }
  .day {
    width: fit-content; margin: 0.2rem auto 1rem; padding: 0.2rem 0.75rem;
    border-radius: 999px; background: var(--notice); color: var(--ink-soft); font-size: 0.75rem;
  }
  .notice {
    width: fit-content; max-width: 85%; margin: 0.4rem auto 0.9rem; padding: 0.3rem 0.8rem;
    border-radius: 10px; background: var(--notice); color: var(--ink-soft); font-size: 0.78rem; text-align: center;
  }

  .msg { display: flex; gap: 0.5rem; margin-bottom: 0.55rem; align-items: flex-start; }
  .msg.me { justify-content: flex-end; }
  .msg .avatar { width: 34px; height: 34px; border-radius: 13px; }
  .msg .avatar svg { width: 19px; height: 19px; }
  .msg.cont .avatar { visibility: hidden; height: 0; }
  .body { display: flex; flex-direction: column; max-width: 76%; min-width: 0; }
  .msg.me .body { align-items: flex-end; }
  .name { font-size: 0.75rem; color: var(--ink-soft); margin: 0 0 0.2rem 0.15rem; }
  .msg.cont .name { display: none; }
  .row { display: flex; align-items: flex-end; gap: 0.35rem; }
  .msg.me .row { flex-direction: row-reverse; }
  .bubble {
    padding: 0.55rem 0.8rem; border-radius: 16px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere;
    background: var(--bot); color: var(--bot-ink); box-shadow: var(--shadow);
    border-top-left-radius: 4px;
  }
  .msg.cont .bubble { border-top-left-radius: 16px; }
  .msg.me .bubble { background: var(--me); color: var(--me-ink); border-top-left-radius: 16px; border-top-right-radius: 4px; }
  .time { flex: none; font-size: 0.68rem; color: var(--ink-soft); white-space: nowrap; }

  /* 개인정보를 가려서 보냈다는 표시: 내 말풍선 아래 */
  .masknote { display: flex; align-items: center; gap: 0.35rem; margin-top: 0.25rem; font-size: 0.72rem; color: var(--ink-soft); }
  .masknote::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--stamp-unclear); }

  /* 입력 중 표시 */
  .typing { display: inline-flex; gap: 4px; padding: 0.75rem 0.9rem; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); opacity: 0.35; }

  /* 처리 기록: 말풍선 아래 접힌 상태로, 누르면 펼침 */
  details.trace { margin-top: 0.3rem; font-size: 0.75rem; color: var(--ink-soft); }
  details.trace summary {
    list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.1rem 0.15rem; border-radius: 6px;
  }
  details.trace summary::-webkit-details-marker { display: none; }
  details.trace summary::after { content: "▾"; font-size: 0.7rem; }
  details.trace[open] summary::after { content: "▴"; }
  .stamp { font-weight: 600; color: var(--stamp-ok); }
  .stamp.blocked { color: var(--stamp-block); }
  .stamp.unclear { color: var(--stamp-unclear); }
  .stamp.error { color: var(--stamp-block); }
  .trace dl {
    display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.7rem; margin: 0.35rem 0 0;
    padding: 0.55rem 0.7rem; border-radius: 10px; background: var(--notice);
  }
  .trace dt { color: var(--ink-soft); }
  .trace dd { margin: 0; color: var(--ink); }
  .bar { display: inline-block; width: 70px; height: 5px; border-radius: 3px; background: var(--chip-line); vertical-align: middle; margin-right: 0.35rem; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--me); }

  /* 빠른 질문 */
  .quick { display: flex; gap: 0.4rem; overflow-x: auto; padding: 0.15rem 0 0.4rem 2.6rem; margin-bottom: 0.6rem; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button {
    flex: none; font: 500 0.82rem/1.2 var(--sans); color: var(--ink); cursor: pointer;
    background: var(--chip); border: 1px solid var(--chip-line); border-radius: 999px; padding: 0.45rem 0.8rem;
  }
  .quick button:hover { border-color: var(--me); color: var(--me); }

  /* 입력 바 */
  form {
    display: flex; align-items: flex-end; gap: 0.5rem;
    padding: 0.55rem 0.7rem calc(0.55rem + env(safe-area-inset-bottom, 0px));
    background: var(--bar); border-top: 1px solid var(--chip-line);
  }
  .field { flex: 1; min-width: 0; position: relative; }
  textarea {
    display: block; width: 100%; resize: none; max-height: 7.5rem; min-height: 2.5rem;
    font: inherit; color: var(--ink); background: var(--bot);
    border: 1px solid transparent; border-radius: 20px; padding: 0.5rem 0.95rem; line-height: 1.45;
  }
  textarea:focus { border-color: var(--chip-line); }
  .count { position: absolute; right: 0.8rem; top: -1.15rem; font-size: 0.68rem; color: var(--ink-soft); }
  .count.over { color: var(--stamp-block); }
  .send {
    flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--me); color: #fff; display: grid; place-items: center;
  }
  .send svg { width: 18px; height: 18px; }
  .send:disabled { opacity: 0.4; cursor: default; }
  :focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* 움직임: 새 말풍선이 아래에서 올라오고, 입력 중 점이 차례로 뜀 */
  @media (prefers-reduced-motion: no-preference) {
    .msg.pop { animation: pop 0.22s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
    .typing i { animation: blink 1.1s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 60%, 100% { opacity: 0.35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  }
</style>
</head>
<body>
<div class="room">
  <header class="top">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/></svg>
    </div>
    <div class="who">
      <strong>은행 문의 안내</strong>
      <span><i class="dot" id="dot"></i><span id="state">연결 확인 중</span></span>
    </div>
    <div class="switch" role="radiogroup" aria-label="답변 모델">
      <label title="GPT-5.6 Luna"><input type="radio" name="model" value="cloud" checked>상용</label>
      <label title="이 컴퓨터의 Qwen 2.5 7B"><input type="radio" name="model" value="local">로컬</label>
    </div>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>

  <form id="form">
    <div class="field">
      <label for="question" class="sr">질문</label>
      <textarea id="question" rows="1" maxlength="600" placeholder="메시지 입력"></textarea>
      <span class="count" id="count" hidden></span>
    </div>
    <button class="send" id="send" type="submit" aria-label="보내기" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l.02 6.5L15 12 3.42 13.9z"/></svg>
    </button>
  </form>
</div>

<script>
const MAX = 500;
const ROUTES = {
  answered: { text: "답변", cls: "" },
  blocked_by_classifier: { text: "업무 외 안내", cls: "blocked" },
  blocked_by_llm: { text: "업무 외 안내 (재확인)", cls: "blocked" },
  unclear: { text: "질문 확인 필요", cls: "unclear" },
  error: { text: "답변 실패", cls: "error" },
};
const QUICK = ["환전 신청은 어떻게 하나요?", "통장 비밀번호를 여러 번 틀려서 막혔어요", "대출 상환일을 하루 넘겼어요", "자동이체 출금일을 바꾸고 싶어요"];
const BOT_ICON = document.querySelector(".top .avatar").innerHTML;

const $ = (id) => document.getElementById(id);
const chat = $("chat"), form = $("form"), input = $("question"), send = $("send");
let lastSender = null, busy = false;

function el(tag, attrs = {}, text) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
}
const now = () => new Date().toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
const scrollDown = () => requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });

function addMessage(sender, content) {
  const msg = el("div", { class: `msg ${sender} pop` });
  if (sender === "bot" && lastSender === "bot") msg.classList.add("cont");
  if (sender === "bot") {
    const av = el("div", { class: "avatar", "aria-hidden": "true" }); av.innerHTML = BOT_ICON; msg.append(av);
  }
  const body = el("div", { class: "body" });
  if (sender === "bot") body.append(el("div", { class: "name" }, "은행 안내"));
  const row = el("div", { class: "row" });
  const bubble = el("div", { class: "bubble" });
  if (typeof content === "string") bubble.textContent = content; else bubble.append(content);
  const time = el("span", { class: "time" }, now());
  row.append(bubble, time);
  body.append(row);
  msg.append(body);
  chat.append(msg);
  lastSender = sender;
  scrollDown();
  return { msg, body, bubble, time };
}

function describeMask(masked) {
  return Object.entries(masked || {}).map(([kind, n]) => `${kind} ${n}건`).join(", ");
}

function addNotice(text) { chat.append(el("div", { class: "notice" }, text)); lastSender = null; scrollDown(); }

function addQuick() {
  document.querySelectorAll(".quick").forEach((q) => q.remove());
  const box = el("div", { class: "quick" });
  QUICK.forEach((q) => {
    const b = el("button", { type: "button" }, q);
    b.addEventListener("click", () => ask(q));
    box.append(b);
  });
  chat.append(box);
  scrollDown();
}

function addTrace(body, data) {
  const route = ROUTES[data.route] || { text: data.route, cls: "" };
  const d = el("details", { class: "trace" });
  const s = el("summary");
  s.append(el("span", { class: `stamp ${route.cls}` }, route.text), "처리 기록");
  d.append(s);
  const dl = el("dl");
  const row = (k, v) => { dl.append(el("dt", {}, k)); const dd = el("dd"); typeof v === "string" ? dd.textContent = v : dd.append(v); dl.append(dd); };
  if (data.label) row("분류", data.label);
  if (typeof data.confidence === "number") {
    const pct = Math.round(data.confidence * 100);
    const v = el("span"); const bar = el("span", { class: "bar" }); const f = el("i"); f.style.width = `${pct}%`; bar.append(f);
    v.append(bar, `${pct}%`); row("확신도", v);
  }
  row("답변 모델", data.model ? (data.model === "cloud" ? "상용 (GPT-5.6 Luna)" : "로컬 (Qwen 2.5 7B)") : "호출 안 함");
  const t = data.latency_s || {};
  if (typeof t.total === "number") row("응답 시간", `${t.total.toFixed(2)}초`);
  if (data.masked && Object.keys(data.masked).length) row("개인정보", `가려서 전송 (${describeMask(data.masked)})`);
  if (data.error) row("원인", data.error);
  d.append(dl);
  body.append(d);
}

function showTyping() {
  const dots = el("span", { class: "typing", "aria-label": "답변 작성 중" });
  dots.append(el("i"), el("i"), el("i"));
  const m = addMessage("bot", dots);
  m.bubble.style.padding = "0";
  m.time.textContent = "";
  return m;
}

async function ask(question) {
  if (busy) return;
  busy = true; updateSend();
  document.querySelectorAll(".quick").forEach((q) => q.remove());
  const mine = addMessage("me", question);
  const model = document.querySelector('input[name="model"]:checked').value;
  const typing = showTyping();
  try {
    const resp = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, model }) });
    const data = await resp.json();
    typing.msg.remove(); lastSender = "me";
    if (resp.status === 422) {
      addNotice((data.detail?.[0]?.msg || "질문 형식을 확인해 주세요.").replace(/^Value error,\s*/, ""));
      return;
    }
    if (data.masked && Object.keys(data.masked).length) {
      mine.body.append(el("div", { class: "masknote" }, `개인정보를 가려서 전송했어요 (${describeMask(data.masked)})`));
    }
    const m = addMessage("bot", data.answer);
    addTrace(m.body, data);
    if (data.route !== "answered") addQuick();
  } catch {
    typing.msg.remove(); lastSender = "me";
    addNotice("서버에 연결할 수 없어요. 서버가 실행 중인지 확인한 뒤 다시 보내 주세요.");
    loadHealth();
  } finally {
    busy = false; updateSend(); scrollDown(); input.focus();
  }
}

async function loadHealth() {
  const dot = $("dot"), state = $("state");
  try {
    const h = await (await fetch("/health")).json();
    const model = document.querySelector('input[name="model"]:checked').value;
    const llmOk = h.llm[model];
    const ok = h.classifier.loaded && llmOk;
    dot.className = `dot ${ok ? "on" : "off"}`;
    state.textContent = !h.classifier.loaded ? "분류 모델을 불러오지 못했어요"
      : !llmOk ? (model === "cloud" ? "상용 모델 설정이 없어요" : "로컬 모델이 꺼져 있어요")
      : "답변 가능";
  } catch {
    dot.className = "dot off"; state.textContent = "서버 연결 안 됨";
  }
}

function updateSend() { const n = input.value.trim().length; send.disabled = busy || n === 0 || n > MAX; }
function autosize() { input.style.height = "auto"; input.style.height = `${Math.min(input.scrollHeight, 120)}px`; }
function updateCount() {
  const n = input.value.trim().length, c = $("count");
  c.hidden = n < MAX * 0.8; c.textContent = `${n} / ${MAX}`; c.classList.toggle("over", n > MAX);
}

input.addEventListener("input", () => { autosize(); updateCount(); updateSend(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
});
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || q.length > MAX || busy) return;
  input.value = ""; autosize(); updateCount();
  ask(q);
});
document.querySelectorAll('input[name="model"]').forEach((r) => r.addEventListener("change", () => {
  addNotice(r.value === "cloud" ? "이제 상용 모델(GPT-5.6 Luna)이 답해요." : "이제 이 컴퓨터의 로컬 모델(Qwen 2.5 7B)이 답해요.");
  loadHealth();
}));

// 첫 화면
chat.append(el("div", { class: "day" }, new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" })));
addMessage("bot", "안녕하세요. 은행 업무 안내 챗봇이에요.\n계좌, 이체, 대출, 예금·적금, 환전에 대해 물어보세요.");
addMessage("bot", "질문마다 따로 답하고, 앞의 대화는 기억하지 않아요. 답변 아래 '처리 기록'을 누르면 질문이 어떻게 분류되고 처리됐는지 볼 수 있어요.");
addQuick();
loadHealth();
input.focus();
</script>
</body>
</html>
